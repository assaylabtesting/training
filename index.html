<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training</title>
<meta name="theme-color" content="#E4E7E5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4E7E5;
  --surface:#F3F4F2;
  --ink:#1A1F24;
  --muted:#5C666F;
  --line:#C9CFCC;
  --chest:#8A6508;
  --combat-bg:#1A1F24; --combat-fg:#F3F4F2;
  --gym-bg:#2E5170;    --gym-fg:#F3F4F2;
  --run-bg:#3C7A55;    --run-fg:#F3F4F2;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14181B;
    --surface:#1D2327;
    --ink:#E8ECEA;
    --muted:#93A0A8;
    --line:#2D363C;
    --chest:#E3B341;
    --combat-bg:#D5DCE0; --combat-fg:#14181B;
    --gym-bg:#5B8DB5;    --gym-fg:#0F1417;
    --run-bg:#6DB68A;    --run-fg:#0F1417;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--body);font-size:16px;line-height:1.45;
}
.wrap{
  max-width:520px;margin:0 auto;
  padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px));
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

h1{font-family:var(--display);font-weight:600;font-size:36px;line-height:1;margin:0 0 4px;letter-spacing:.01em}
.blurb{margin:0 0 16px;color:var(--muted);font-size:14px}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.seg button{
  min-height:44px;border:1px solid var(--line);border-radius:8px;
  background:var(--surface);font-weight:500;
}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:14px}
.day{
  position:relative;min-height:56px;padding:8px 0 10px;
  border:1px solid var(--line);border-radius:8px;background:var(--surface);
  font-family:var(--display);font-weight:500;font-size:17px;line-height:1;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:8px;
}
.day .bar{display:block;width:70%;height:6px;border-radius:3px;background:var(--kb)}
.day[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day[aria-current="date"]::after{
  content:"";position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--chest);
}

.k-combat{--kb:var(--combat-bg);--kf:var(--combat-fg)}
.k-gym{--kb:var(--gym-bg);--kf:var(--gym-fg)}
.k-run{--kb:var(--run-bg);--kf:var(--run-fg)}

.panel{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.phead{background:var(--kb);color:var(--kf);padding:16px 16px 18px}
.phead .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.dayname{font-family:var(--display);font-weight:500;font-size:20px;opacity:.85}
.count{font-family:var(--display);font-weight:500;font-size:20px}
.phead h2{font-family:var(--display);font-weight:600;font-size:44px;line-height:1;margin:6px 0 0;letter-spacing:.01em}
.phead .note{margin:10px 0 0;font-size:14px;opacity:.92}

.list{list-style:none;margin:0;padding:0}
.row{
  display:grid;grid-template-columns:28px 1fr auto;column-gap:12px;row-gap:6px;
  padding:12px 14px 12px 12px;border-top:1px solid var(--line);border-left:4px solid transparent;
}
.row:first-child{border-top:0}
.row.chest{border-left-color:var(--chest)}
.row.opt .name{color:var(--muted)}
.row input[type=checkbox]{width:24px;height:24px;margin:2px 0 0;accent-color:var(--kb)}
.name{font-weight:500}
.tag{display:block;font-size:12px;color:var(--chest);font-weight:500}
.opt .tag{color:var(--muted)}
.alt{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.runlog{border-top:1px solid var(--line);padding:14px 16px 8px}
.runlog h4{font-family:var(--display);font-weight:600;font-size:20px;margin:16px 0 8px}
.wkrow{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.wkrow b{font-weight:500}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:6px 0 8px}
.meter i{display:block;height:100%;background:var(--run-bg);border-radius:4px}
.rf{display:grid;gap:12px}
.rf label,.rf .fg{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.rf input{width:100%;min-height:44px;padding:0 10px;font-size:16px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--ink)}
.r2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.r3{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.rf .hint{margin:0}
.runitem{display:grid;grid-template-columns:1fr 44px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.runitem small{display:block;color:var(--muted);font-size:12px}
.runitem button{min-height:44px;background:none;border:0;font-size:20px;color:var(--muted)}
.runlist{margin-top:14px}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:4px}
.topbar h1{margin:0 0 4px}
.acct{display:flex;flex-direction:column;align-items:flex-end;max-width:55%}
.who{font-size:12px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync{font-size:12px;color:var(--muted)}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;min-height:44px;padding:0}
.inl2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn2{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-weight:500}
.gbtn{width:100%}
.or{text-align:center;margin:10px 0 12px}
.danger{background:#B3261E;border-color:#B3261E;color:#fff}
.warn{margin:0 0 8px;font-size:13px;color:var(--ink)}
.ent li.confirm{display:block;padding:8px 0}
.runitem.confirm{grid-template-columns:1fr}
.pmenu{display:grid;gap:4px;margin-bottom:14px}
.pmenu select{width:100%;min-height:48px;padding:0 12px;margin-bottom:8px;font-size:16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--ink)}
.plabel{font-size:12px;color:var(--muted)}
.iout{white-space:pre-wrap;margin:12px 0 4px;font-size:15px;line-height:1.5}
.iout:empty{display:none}
.by{margin-top:14px;font-weight:500;color:var(--ink)}
[hidden]{display:none !important}
.k-rest{--kb:var(--line);--kf:var(--ink)}
.phead .note:empty{display:none}
.chips{display:grid;gap:8px}
.chip{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:15px;color:var(--ink)}
.chip input{width:22px;height:22px;margin:0;accent-color:var(--gym-bg)}
.fg2{display:grid;gap:6px;margin-bottom:12px}
.fl2{font-size:13px;color:var(--muted)}
.hgrp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lnks{display:flex;gap:14px}
.btn2.gbtn{width:100%;margin-top:8px}
.btn:disabled{opacity:.5}
.sets{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.1;white-space:nowrap;text-align:right}
.wt{grid-column:2 / 4;display:flex;align-items:center;gap:8px}
.wt input{
  width:92px;min-height:40px;padding:0 10px;font-size:16px;
  background:var(--bg);border:1px solid var(--line);border-radius:8px;
}
.wt span{font-size:13px;color:var(--muted)}
.row.done .name{text-decoration:line-through;text-decoration-thickness:1px;color:var(--muted)}

.tip{margin:0;padding:14px 16px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.tip:first-child{border-top:0}

h3{font-family:var(--display);font-weight:600;font-size:24px;margin:26px 0 8px}
.rules{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.rules li{margin-bottom:6px}
.foot{margin-top:22px;font-size:12px;color:var(--muted)}
.legend{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend i{width:4px;height:16px;background:var(--chest);display:inline-block}
.phead .right{display:flex;align-items:center;gap:12px}
.edit{min-height:36px;padding:0 14px;border:1px solid currentColor;border-radius:8px;background:transparent;font-weight:500;font-size:14px;color:inherit}
.erow{display:grid;grid-template-columns:1fr 44px 44px 44px;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
.nm{grid-column:1 / -1}
.erow input,.add input,.erow select,.add select,.ctl select{width:100%;min-height:44px;padding:0 10px;font-size:16px;background:var(--bg);border:1px solid var(--line);border-radius:8px}
.erow .rm,.erow .mv{min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:20px;line-height:1}
.erow .mv:disabled{opacity:.35}
.add{display:grid;grid-template-columns:1fr 84px;gap:8px;padding:12px;border-top:1px solid var(--line)}
.btn{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:500}
.ctl{padding:12px;border-top:1px solid var(--line);display:grid;gap:8px}
.ctl label{font-size:13px;color:var(--muted)}
.reset{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;min-height:44px;text-align:left;padding:0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{min-height:44px;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;font-family:var(--display);font-weight:500;font-size:20px;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.hcard{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 14px 10px;margin-bottom:12px}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hcard .hn{margin:0;font-size:22px}
.hv{font-family:var(--display);font-weight:600;font-size:28px;white-space:nowrap}
.hd{margin:2px 0 8px;font-size:13px;color:var(--muted)}
.hint{margin:6px 0;font-size:13px;color:var(--muted)}
.chart{display:block;width:100%;height:auto}
.chart .ln{fill:none;stroke:var(--gym-bg);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--gym-bg)}
.chart.body .ln{stroke:var(--run-bg)}
.chart.body .dot{fill:var(--run-bg)}
.chart .gl{stroke:var(--line);stroke-width:1;stroke-dasharray:3 3}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.hcard details{margin-top:6px;border-top:1px solid var(--line)}
.hcard summary{min-height:44px;display:flex;align-items:center;font-size:14px;color:var(--muted);cursor:pointer}
.ent{list-style:none;margin:0;padding:0 0 6px}
.ent li{display:grid;grid-template-columns:1fr auto 44px;align-items:center;gap:8px;font-size:14px}
.ent .x{min-height:44px;background:none;border:0;font-size:20px;color:var(--muted)}
.ctl2{display:grid;gap:6px;margin-bottom:12px}
.ctl2 label{font-size:13px;color:var(--muted)}
.ctl2 select,.ctl2 input,.weigh input{width:100%;min-height:44px;padding:0 10px;font-size:16px;background:var(--bg);border:1px solid var(--line);border-radius:8px}
.inl{display:grid;grid-template-columns:1fr 84px;gap:8px}
.weigh{display:grid;grid-template-columns:1fr 84px 76px;gap:8px;align-items:center;padding:12px;margin-bottom:12px;border:1px solid var(--line);border-left:4px solid var(--chest);border-radius:12px;background:var(--surface)}
.weigh div{display:grid;font-size:13px;color:var(--muted)}
.weigh div b{font-size:15px;color:var(--ink);font-weight:500}
</style>
</head>

const KEY = "training:v1";
const ORDER = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];
const JS_DAYS = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
const FULL = { mon: "Monday", tue: "Tuesday", wed: "Wednesday", thu: "Thursday", fri: "Friday", sat: "Saturday", sun: "Sunday" };
const SHORT = { mon: "Mon", tue: "Tue", wed: "Wed", thu: "Thu", fri: "Fri", sat: "Sat", sun: "Sun" };

const $app = document.getElementById("app");

function weekKey() {
  const d = new Date();
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  const p = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function todayKey() { return JS_DAYS[new Date().getDay()]; }
function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function load() {
  const base = { program: "fb3", weights: {}, done: {} };
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && typeof s === "object") Object.assign(base, s);
  } catch (e) {}
  const wk = weekKey() + "|";
  Object.keys(base.done).forEach((k) => { if (!k.startsWith(wk)) delete base.done[k]; });
  if (!base.history || typeof base.history !== "object") base.history = {};
  if (!Array.isArray(base.body)) base.body = [];
  if (!Array.isArray(base.runs)) base.runs = [];
  if (!JS_DAYS.includes(base.bodyDay)) base.bodyDay = "sun";
  if (!base.custom || typeof base.custom !== "object") base.custom = {};
  if (!base.custom.sessions || typeof base.custom.sessions !== "object") base.custom.sessions = {};
  if (!base.custom.week || typeof base.custom.week !== "object") base.custom.week = {};
  if (!PROGRAMS[base.program]) base.program = "fb3";
  return base;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  if (typeof user !== "undefined" && user) { setDirty(true); schedulePush(); }
}

const state = load();
let selected = todayKey();
let editing = false;
let tab = "program";
let pendingDel = "";

let GOAL_KM = 15;
const runAuto = { km: false, time: false, pace: false, stride: false };

function wkOf(ds) {
  const d = new Date(ds + "T00:00:00");
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return ymd(d);
}
function fmtDur(sec) {
  sec = Math.round(sec);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const p = (n) => String(n).padStart(2, "0");
  return h ? h + ":" + p(m) + ":" + p(s) : m + ":" + p(s);
}
function fmtKm(v) { return String(Number(v.toFixed(2))); }

function runVal(id) {
  const n = parseFloat(String(document.getElementById(id).value).replace(",", "."));
  return isFinite(n) && n > 0 ? n : 0;
}
function readRun() {
  return {
    km: runVal("rKm"),
    time: runVal("rH") * 3600 + runVal("rM") * 60 + runVal("rS"),
    pace: runVal("rPm") * 60 + runVal("rPs"),
    hr: runVal("rHr"), cad: runVal("rCad"), stride: runVal("rStr")
  };
}
function setEl(id, v) { document.getElementById(id).value = v; }
function fillTime(sec) {
  sec = Math.round(sec);
  setEl("rH", sec >= 3600 ? Math.floor(sec / 3600) : "");
  setEl("rM", Math.floor((sec % 3600) / 60));
  setEl("rS", sec % 60);
  runAuto.time = true;
}
function fillPace(sec) {
  sec = Math.round(sec);
  setEl("rPm", Math.floor(sec / 60));
  setEl("rPs", sec % 60);
  runAuto.pace = true;
}
function fillKm(v) { setEl("rKm", Number(v.toFixed(2))); runAuto.km = true; }
function fillStride(v) { setEl("rStr", Number(v.toFixed(2))); runAuto.stride = true; }

function recalcRun() {
  let r = readRun();
  if (r.km && r.time && (!r.pace || runAuto.pace)) fillPace(r.time / r.km);
  else if (r.km && r.pace && (!r.time || runAuto.time)) fillTime(r.pace * r.km);
  else if (r.time && r.pace && (!r.km || runAuto.km)) fillKm(r.time / r.pace);
  r = readRun();
  const pace = r.pace || (r.km && r.time ? r.time / r.km : 0);
  if (r.cad && pace && (!r.stride || runAuto.stride)) fillStride(60000 / pace / r.cad);
  r = readRun();
  const hint = document.getElementById("runHint");
  if (hint) {
    if (r.km && r.time && r.pace && Math.abs(r.time / r.km - r.pace) > 3) {
      hint.textContent = "Distance and time work out to " + fmtDur(r.time / r.km) + " per km. The run is saved using distance and time.";
    } else {
      hint.textContent = "Enter any two of distance, time and pace and the third fills in. Stride fills in from pace and cadence.";
    }
  }
}

function saveRun() {
  recalcRun();
  const r = readRun();
  const hint = document.getElementById("runHint");
  if (!(r.km && r.time)) { if (hint) hint.textContent = "Enter at least two of distance, time and pace."; return; }
  if (r.km > 300 || r.time > 86400) { if (hint) hint.textContent = "Those numbers look too large. Check the distance and time."; return; }
  const ds = document.getElementById("rDate").value || ymd(new Date());
  state.runs.push({ id: Date.now(), w: wkOf(ds), d: ds, km: r.km, sec: Math.round(r.time), hr: r.hr || 0, cad: r.cad || 0, stride: r.stride || 0 });
  state.runs.sort((a, b) => a.id - b.id);
  save(); render();
}

function runItem(r) {
  const bits = [fmtDur(r.sec / r.km) + " /km"];
  if (r.hr) bits.push(Math.round(r.hr) + " bpm");
  if (r.cad) bits.push(Math.round(r.cad) + " spm");
  if (r.stride) bits.push(fmtKm(r.stride) + " m stride");
  if (pendingDel === "r|" + r.id) {
    return `<div class="runitem confirm"><div><p class="warn">Delete this run? It is removed from this week's total and your history. This can't be undone.</p>` +
      `<div class="inl2"><button type="button" class="btn danger" data-delok="r|${r.id}">Delete</button><button type="button" class="btn2" data-delno="1">Cancel</button></div></div></div>`;
  }
  return `<div class="runitem"><div>${fmtDate(r.d)}: ${fmtKm(r.km)} km in ${fmtDur(r.sec)}<small>${bits.join(", ")}</small></div>` +
    `<button type="button" aria-label="Delete run from ${fmtDate(r.d)}" data-delrun="${r.id}">×</button></div>`;
}

function runLog(label) {
  runAuto.km = runAuto.time = runAuto.pace = runAuto.stride = false;
  const wk = weekKey();
  const mine = state.runs.filter((r) => r.w === wk).sort((a, b) => (a.d < b.d ? 1 : a.d > b.d ? -1 : b.id - a.id));
  const total = mine.reduce((s, r) => s + r.km, 0);
  const pct = Math.min(100, (total / GOAL_KM) * 100);
  return `<div class="runlog"><div class="wkrow"><b>This week</b><span>${fmtKm(total)} of ${GOAL_KM} km</span></div>` +
    `<div class="meter"><i style="width:${pct.toFixed(0)}%"></i></div>` +
    `<h4>Log a run${label ? " (" + esc(label) + " after lifting)" : ""}</h4><div class="rf">` +
    `<label>Date<input id="rDate" type="date" value="${entryDate()}"></label>` +
    `<label>Total distance (km)<input id="rKm" data-rf="km" type="text" inputmode="decimal" placeholder="km" autocomplete="off"></label>` +
    `<div class="fg"><span>Total time</span><div class="r2">` +
    `<input id="rH" data-rf="time" type="text" inputmode="numeric" placeholder="h" aria-label="Hours" autocomplete="off">` +
    `<input id="rM" data-rf="time" type="text" inputmode="numeric" placeholder="min" aria-label="Minutes" autocomplete="off">` +
    `<input id="rS" data-rf="time" type="text" inputmode="numeric" placeholder="sec" aria-label="Seconds" autocomplete="off"></div></div>` +

function runsCard() {
  const runs = state.runs.slice().sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : a.id - b.id));
  if (!runs.length) return "";
  const last = runs[runs.length - 1];
  const pts = runs.map((r) => ({ d: r.d, kg: r.sec / r.km }));
  const byWeek = {};
  runs.forEach((r) => { byWeek[r.w] = (byWeek[r.w] || 0) + r.km; });
  const weeks = Object.keys(byWeek).sort().slice(-6).reverse();
  const wrows = weeks.map((w) =>
    `<div class="wkrow"><span>Week of ${fmtDate(w)}</span><b>${fmtKm(byWeek[w])} km</b></div>` +
    `<div class="meter"><i style="width:${Math.min(100, (byWeek[w] / GOAL_KM) * 100).toFixed(0)}%"></i></div>`
  ).join("");
  const all = runs.slice().reverse().map(runItem).join("");
  return `<section class="hcard"><div class="hrow"><h3 class="hn">Runs</h3><span class="hv">${fmtDur(last.sec / last.km)} /km</span></div>` +
    `<p class="hd">Latest: ${fmtKm(last.km)} km on ${fmtDate(last.d)}</p>` +
    (runs.length > 1 ? chart(pts, "body", fmtDur) : `<p class="hint">Log another run to see your pace graph.</p>`) +
    `<p class="hd">The graph shows average pace per run. Weekly distance against ${GOAL_KM} km:</p>${wrows}` +
    `<details${pendingDel && pendingDel.indexOf("r|") === 0 ? " open" : ""}><summary>All runs (${runs.length})</summary>${all}</details></section>`;
}

// The date an entry should carry: the day that is open in the app, as long as
// it is today or earlier this week. Later days this week use today's date.
function entryDate() {
  const now = new Date();
  const idx = ORDER.indexOf(selected);
  const todayIdx = ORDER.indexOf(todayKey());
  if (idx < 0 || idx > todayIdx) return ymd(now);
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (todayIdx - idx));
  return ymd(d);
}

function ymd(d) {
  const p = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function fmtKg(v) { return String(Number(v.toFixed(1))); }
function fmtDate(d) { return new Date(d + "T00:00:00").toLocaleDateString("en", { month: "short", day: "numeric" }); }
function parseKg(v) {
  const n = parseFloat(String(v).replace(",", "."));
  return isFinite(n) && n > 0 && n < 1000 ? n : null;
}

function recordWeight(slg, name, val) {
  const kg = parseKg(val);
  if (kg === null) return;
  const h = state.history[slg] || (state.history[slg] = { n: name, e: [] });
  h.n = name;
  const d = entryDate();
  const ex = h.e.find((x) => x.d === d);
  if (ex) ex.kg = kg; else h.e.push({ d, kg });
  h.e.sort((a, b) => (a.d < b.d ? -1 : 1));
  save();
}

function thisWeekBody() {
  const w = weekKey();
  return state.body.find((x) => x.w === w) || null;
}
function saveBody(val) {
  const kg = parseKg(val);
  if (kg === null) return false;
  const w = weekKey(), d = ymd(new Date());
  const ex = state.body.find((x) => x.w === w);
  if (ex) { ex.kg = kg; ex.d = d; } else state.body.push({ w, d, kg });
  state.body.sort((a, b) => (a.d < b.d ? -1 : 1));
  save();
  return true;
}

function deltaText(e) {
  if (e.length < 2) return "First entry on " + fmtDate(e[0].d);
  const diff = e[e.length - 1].kg - e[0].kg;
  const s = Math.abs(diff) < 0.05 ? "No change" : (diff > 0 ? "+" : "-") + fmtKg(Math.abs(diff)) + " kg";
  return s + " since " + fmtDate(e[0].d);
}

function chart(pts, cls, fmt) {
  const f = fmt || fmtKg;
  const W = 320, H = 130, L = 40, R = 14, T = 14, B = 24;
  const ts = pts.map((p) => new Date(p.d + "T00:00:00").getTime());
  const x0 = ts[0], x1 = ts[ts.length - 1];
  const ys = pts.map((p) => p.kg);
  const lo = Math.min.apply(null, ys), hi = Math.max.apply(null, ys);
  let y0 = lo, y1 = hi;
  if (y1 === y0) { y0 -= 1; y1 += 1; } else { const pad = (y1 - y0) * 0.18; y0 -= pad; y1 += pad; }
  const X = (t) => (x1 === x0 ? L + (W - L - R) / 2 : L + ((t - x0) / (x1 - x0)) * (W - L - R));
  const Y = (v) => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const path = pts.map((p, i) => (i ? "L" : "M") + X(ts[i]).toFixed(1) + " " + Y(p.kg).toFixed(1)).join(" ");
  const dots = pts.map((p, i) => `<circle class="dot" cx="${X(ts[i]).toFixed(1)}" cy="${Y(p.kg).toFixed(1)}" r="3.5"></circle>`).join("");
  const lines = hi === lo ? [hi] : [hi, lo];
  const grid = lines.map((v) =>
    `<line class="gl" x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"></line>` +
    `<text x="${L - 6}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${f(v)}</text>`
  ).join("");
  const xl = `<text x="${L}" y="${H - 6}" text-anchor="start">${fmtDate(pts[0].d)}</text>` +
    `<text x="${W - R}" y="${H - 6}" text-anchor="end">${fmtDate(pts[pts.length - 1].d)}</text>`;
  return `<svg class="chart ${cls}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Line graph from ${f(pts[0].kg)} to ${f(pts[pts.length - 1].kg)}, ${fmtDate(pts[0].d)} to ${fmtDate(pts[pts.length - 1].d)}">` +
    `${grid}<path class="ln" d="${path}"></path>${dots}${xl}</svg>`;
}

function confirmDelete(dk) {
  const parts = dk.split("|");
  pendingDel = "";
  if (parts[0] === "r") {
    state.runs = state.runs.filter((x) => String(x.id) !== parts[1]);
  } else if (parts[0] === "h") {
    const slg = parts[1], d = parts[2];
    const h = state.history[slg];
    if (h) {
      h.e = h.e.filter((x) => x.d !== d);
      if (h.e.length) state.weights[slg] = fmtKg(h.e[h.e.length - 1].kg);
      else { delete state.history[slg]; delete state.weights[slg]; }
    }
    if (wkOf(d) === weekKey()) {
      const suf = "|" + slg;
      Object.keys(state.done).forEach((k) => { if (k.endsWith(suf)) delete state.done[k]; });
    }
  } else {
    state.body = state.body.filter((x) => x.d !== parts[2]);
  }
  save(); render();
}

function doneKey(sid, item) { return weekKey() + "|" + sid + "|" + slug(item.n); }

function insightPayload() {
  const prog = PROGRAMS[state.program];
  const sid = getSid(selected);
  const s = SESSIONS[sid];
  const wk = weekKey();
  const weekKm = state.runs.filter((r) => r.w === wk).reduce((t, r) => t + r.km, 0);
  const exercises = getItems(sid).filter((i) => !i.opt).map((i) => {
    const h = state.history[slug(i.n)];
    return {
      exercise: i.n,
      plan: i.s,
      doneThisWeek: !!state.done[doneKey(sid, i)],
      recentWeightsKg: h ? h.e.slice(-12).map((x) => ({ date: x.d, kg: x.kg })) : []
    };
  });
  const runs = state.runs.slice(-12).map((r) => ({
    date: r.d, km: r.km, minutes: Math.round((r.sec / 60) * 10) / 10,
    paceSecPerKm: Math.round(r.sec / r.km),
    avgHr: r.hr || undefined, avgCadence: r.cad || undefined, strideM: r.stride || undefined
  }));
  const body = state.body.slice(-12).map((x) => ({ date: x.d, kg: x.kg }));
  const inSession = new Set(getItems(sid).map((i) => slug(i.n)));
  const lastDate = (k) => state.history[k].e[state.history[k].e.length - 1].d;
  const others = Object.keys(state.history)
    .filter((k) => !inSession.has(k) && state.history[k].e.length)
    .sort((a, b) => (lastDate(a) < lastDate(b) ? 1 : lastDate(a) > lastDate(b) ? -1 : 0))
    .slice(0, 12)
    .map((k) => ({ exercise: state.history[k].n, recentWeightsKg: state.history[k].e.slice(-8).map((x) => ({ date: x.d, kg: x.kg })) }));
  const byWeek = {};
  state.runs.forEach((r) => { byWeek[r.w] = (byWeek[r.w] || 0) + r.km; });
  const weeklyKm = Object.keys(byWeek).sort().slice(-8).map((w) => ({ weekStarting: w, km: Math.round(byWeek[w] * 100) / 100 }));
  return {
    today: ymd(new Date()),
    todayWeekday: FULL[todayKey()],
    program: prog.name,
    session: s.title,
    sessionType: s.kind,
    goals: String(state.goals || "").slice(0, 200),
    profile: profileForAI(),
    weeklyRunGoalKm: GOAL_KM,
    runKmThisWeek: Math.round(weekKm * 100) / 100,
    exercises, otherExercisesLogged: others, runs, weeklyRunKm: weeklyKm, bodyWeights: body
  };
}

async function askOne(token, provider, payload) {
  const name = provider === "openai" ? "ChatGPT" : "Claude";
  try {
    const res = await fetch("/api/insight", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify(Object.assign({}, payload, { provider }))
    });
    let data = null;
    try { data = await res.json(); } catch (e) {}
    if (!res.ok || !data || !data.insight) {
      return { error: (data && data.error) || "Insights are not available here. They work on your live site." };
    }
    return { by: name + (data.model ? " (" + data.model + ")" : ""), text: data.insight };
  } catch (e) {
    return { error: name + ": could not reach the server." };
  }
}

function insightItems(li) {
  if (!li) return [];
  return li.items || (li.text ? [{ by: "", text: li.text }] : []);
}

async function getInsight() {
  const out = document.getElementById("insightOut");
  const btn = document.querySelector("[data-insight]");
  if (!sb || !user) { out.textContent = "Sign in to get insights. They use your account to keep usage fair."; return; }
  out.textContent = "Thinking...";
  if (btn) btn.disabled = true;
  try {
    const s = await sb.auth.getSession();
    const token = s.data && s.data.session ? s.data.session.access_token : "";
    const providers = ["openai"];
    const payload = insightPayload();
    const results = await Promise.all(providers.map((p) => askOne(token, p, payload)));
    const good = results.filter((r) => r.text);
    const errs = results.filter((r) => r.error).map((r) => r.error);
    if (!good.length) {
      out.textContent = errs[0] || "Insights are not available here. They work on your live site.";
      if (btn) btn.disabled = false;
      return;
    }
    state.lastInsight = { at: ymd(new Date()), session: SESSIONS[getSid(selected)].title, items: good };
    save();
    render();
    if (errs.length) { const o2 = document.getElementById("insightOut"); if (o2) o2.textContent = errs.join(" "); }
  } catch (e) {
    out.textContent = "Could not reach the server. Try again.";
    if (btn) btn.disabled = false;
  }
}

const GOAL_OPTIONS = [["lose", "Lose weight"], ["muscle", "Build muscle"], ["both", "Lose fat and build muscle"], ["strength", "Get stronger"], ["cardio", "Improve running and cardio"], ["sport", "Sports performance"], ["health", "Stay healthy and fit"]];
const GOAL_TAGS = { lose: ["fat"], muscle: ["muscle"], both: ["fat", "muscle"], strength: ["strength"], cardio: ["cardio"], sport: ["sport"], health: ["health"] };
const TAG_LABELS = { muscle: "building muscle", fat: "losing fat", strength: "getting stronger", cardio: "cardio", sport: "sports performance", health: "staying healthy" };
const LEVELS = [["new", "New to lifting (under 6 months)"], ["some", "Some experience (6 months to 2 years)"], ["experienced", "Experienced (2+ years)"]];
const EQUIP = [["gym", "Full gym"], ["home", "At home (dumbbells and bodyweight)"]];
const ACTS = [["run", "Running"], ["combat", "Kickboxing, MMA or boxing"], ["other", "Other sports"]];

function syncGoal() { GOAL_KM = (state.profile && state.profile.kmGoal) || 15; }

function ageOf(dob) {
  if (!dob) return null;
  const b = new Date(dob + "T00:00:00");
  if (isNaN(b.getTime())) return null;
  const n = new Date();
  let a = n.getFullYear() - b.getFullYear();
  const m = n.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && n.getDate() < b.getDate())) a--;
  return a;
}

function profileForAI() {
  const p = state.profile;
  if (!p) return undefined;
  const lab = (list, v) => { const f = list.find((x) => x[0] === v); return f ? f[1] : undefined; };
  return {
    ageYears: ageOf(p.dob) || undefined,
    sex: p.sex && p.sex !== "Prefer not to say" ? p.sex : undefined,
    heightCm: p.heightCm || undefined,
    goals: (p.goals || []).map((g) => lab(GOAL_OPTIONS, g)),
    experience: lab(LEVELS, p.level),
    daysPerWeek: p.days ? Number(p.days) : undefined,
    equipment: lab(EQUIP, p.equip),
    otherActivities: (p.acts || []).map((a) => lab(ACTS, a))
  };
}

    `<div class="ctl2"><label for="pSex">Sex</label>${sel("pSex", [["Male", "Male"], ["Female", "Female"], ["Prefer not to say", "Prefer not to say"]], p.sex, "Choose")}</div>` +
    `<div class="ctl2"><label for="pUnit">Height</label>` +
    `<select id="pUnit"><option value="cm"${unit === "cm" ? " selected" : ""}>Centimetres</option><option value="ft"${unit === "ft" ? " selected" : ""}>Feet and inches</option></select>` +
    `<div id="hCm"${unit === "cm" ? "" : " hidden"}><input id="pCm" type="text" inputmode="decimal" placeholder="cm" value="${p.heightCm || ""}" aria-label="Height in centimetres" autocomplete="off"></div>` +
    `<div id="hFt" class="hgrp"${unit === "ft" ? "" : " hidden"}>` +
    `<input id="pFt" type="text" inputmode="numeric" placeholder="ft" value="${tot ? Math.floor(tot / 12) : ""}" aria-label="Feet" autocomplete="off">` +
    `<input id="pIn" type="text" inputmode="numeric" placeholder="in" value="${tot ? tot % 12 : ""}" aria-label="Inches" autocomplete="off"></div></div>` +
    `<div class="fg2"><span class="fl2">Goal (choose up to 2)</span><div class="chips">${chk("pgoal", GOAL_OPTIONS, p.goals)}</div><p class="hd" id="pGoalHint"></p></div>` +
    `<div class="ctl2"><label for="pDays">Days per week you can train</label>${sel("pDays", dayOpts, p.days, "Choose")}</div>` +
    `<div class="ctl2"><label for="pLevel">Experience with lifting</label>${sel("pLevel", LEVELS, p.level, "Choose")}</div>` +
    `<div class="ctl2"><label for="pEquip">Where you train</label>${sel("pEquip", EQUIP, p.equip, "Choose")}</div>` +
    `<div class="fg2"><span class="fl2">Other activities (optional)</span><div class="chips">${chk("pact", ACTS, p.acts)}</div></div>` +
    `<div class="ctl2"><label for="pKmGoal">Weekly running or cardio distance goal in km (optional)</label><input id="pKmGoal" type="text" inputmode="decimal" placeholder="15" value="${p.kmGoal || ""}" autocomplete="off"></div>` +
    `<p class="hd">Stored in your account. Only your age, sex, height, goals and training details are shared with the AI coach. Your name and exact birth date are not.</p>` +
    `<button type="button" class="btn gbtn" data-psave="1">Save</button>` +
    (first ? `<button type="button" class="btn2 gbtn" data-pskip="1">Skip for now</button>` : `<button type="button" class="btn2 gbtn" data-pcancel="1">Cancel</button>`) +
    `<p class="hd" id="pMsg"></p></section>`;
}

function readProfile() {
  const v = (id) => { const el = document.getElementById(id); return el ? String(el.value).trim() : ""; };
  const unit = v("pUnit");
  let cm = 0;
  if (unit === "ft") cm = Math.round(((Number(v("pFt")) || 0) * 12 + (Number(v("pIn")) || 0)) * 2.54);
  else cm = Math.round(Number(v("pCm").replace(",", ".")) || 0);
  const kmGoal = Number(v("pKmGoal").replace(",", ".")) || 0;
  return {
    name: v("pName"), dob: v("pDob"), sex: v("pSex"), heightCm: cm, heightUnit: unit,
    goals: Array.prototype.map.call(document.querySelectorAll("[data-pgoal]:checked"), (e) => e.dataset.pgoal),
    days: v("pDays"), level: v("pLevel"), equip: v("pEquip"),
    acts: Array.prototype.map.call(document.querySelectorAll("[data-pact]:checked"), (e) => e.dataset.pact),
    kmGoal: kmGoal > 0 && kmGoal < 1000 ? kmGoal : 0
  };
}

function saveProfile() {
  const p = readProfile();
  const msg = document.getElementById("pMsg");
  const miss = [];
  if (!p.name) miss.push("name");
  if (!p.dob) miss.push("date of birth");
  if (!p.sex) miss.push("sex");
  if (!p.heightCm) miss.push("height");
  if (!p.goals.length) miss.push("a goal");
  if (!p.days) miss.push("days per week");
  if (!p.level) miss.push("experience");
  if (!p.equip) miss.push("where you train");
  if (miss.length) { msg.textContent = "Please add: " + miss.join(", ") + "."; return; }
  const age = ageOf(p.dob);
  if (age === null || age > 100 || age < 0) { msg.textContent = "Check the date of birth."; return; }
  if (age < 13) { msg.textContent = "This app is for people 13 and older."; return; }
  if (p.heightCm < 100 || p.heightCm > 250) { msg.textContent = "Check the height."; return; }
  const first = !state.profile;
  state.profile = p;
  state.profileSkip = false;
  save();
  pview = first ? "recs" : "";
  render();
  window.scrollTo(0, 0);
}

function scoreProgram(id, p) {
  const m = PROGRAM_META[id];
  if (!m) return -99;
  const days = Number(p.days) || 3;
  const tags = [];
  (p.goals || []).forEach((g) => (GOAL_TAGS[g] || []).forEach((t) => tags.push(t)));
  const acts = p.acts || [];
  const age = ageOf(p.dob);
  let s = 0;
  if (m.combat) { if (acts.indexOf("combat") >= 0) s += 6; else return -99; }
  if (m.runner) { if (acts.indexOf("run") >= 0) s += 3; else if (tags.indexOf("cardio") >= 0) s += 2; }
  if (m.equip === "gym" && p.equip === "home") return -99;
  if (m.equip === "home" && p.equip !== "home") s -= 4;
  if (age !== null && age < 18 && id === "fat5") return -99;
  if (m.days === days) s += 5;
  else if (m.days < days) s += 5 - (days - m.days) * 1.5;
  else s -= 8 * (m.days - days);
  s += m.levels.indexOf(p.level) >= 0 ? 4 : -4;
  tags.forEach((t) => { if (m.goals.indexOf(t) >= 0) s += 3; });
  return s;
}

function reasonFor(id, p) {
  const m = PROGRAM_META[id];
  const days = Number(p.days);
  const parts = [m.days === days ? days + " days a week, as you asked" : m.days + " days a week"];
  const tags = [];
  (p.goals || []).forEach((g) => (GOAL_TAGS[g] || []).forEach((t) => { if (tags.indexOf(t) < 0) tags.push(t); }));
  const hit = tags.filter((t) => m.goals.indexOf(t) >= 0).map((t) => TAG_LABELS[t]);
  if (hit.length) parts.push("good for " + hit.join(" and "));
  if (m.equip === "home") parts.push("no gym needed");
  if (m.combat) parts.push("built around your combat training and running");
  if (m.levels.indexOf(p.level) >= 0) parts.push("suits your experience");
  const text = parts.join(", ");
  return text.charAt(0).toUpperCase() + text.slice(1) + ".";
}

function recsView() {
  const p = state.profile;
  if (!p) {
    return `<section class="hcard"><h3 class="hn">Programs for you</h3><p class="hd">Fill in your profile to get recommendations.</p>` +
      `<button type="button" class="btn gbtn" data-profile="edit">Open profile</button></section>`;
  }
  const top = Object.keys(PROGRAMS).map((id) => ({ id, s: scoreProgram(id, p) })).filter((x) => x.s > -50).sort((a, b) => b.s - a.s).slice(0, 3);
  const age = ageOf(p.dob);
  const cards = top.map((x) => {
    const pr = PROGRAMS[x.id];
    const cur = x.id === state.program;
    return `<section class="hcard"><div class="hrow"><h3 class="hn">${esc(pr.name)}</h3></div>` +
      `<p class="hd">${esc(pr.blurb)}</p><p class="hd">${esc(reasonFor(x.id, p))}</p>` +
      `<button type="button" class="btn gbtn" data-usep="${x.id}"${cur ? " disabled" : ""}>${cur ? "Currently using" : "Use this program"}</button></section>`;
  }).join("");
  return `<h3 class="hn">Programs for you</h3>` +
    `<p class="blurb">Matched to your goals, schedule, experience and where you train. You can switch any time from the program menu.</p>` +
    (age !== null && age < 18 ? `<p class="hd">You are under 18. Choose a program with a parent, coach or doctor, and focus on technique and steady progress rather than cutting weight.</p>` : "") +
    (cards || `<p class="hd">No close match. Try the program menu to browse everything.</p>`) +
    `<button type="button" class="btn2 gbtn" data-pback="1">Keep my current program</button>`;
}

function programMenu() {
  const groups = FAMILIES.map((f) => {
    const opts = Object.keys(PROGRAMS).filter((id) => (PROGRAM_META[id] || {}).family === f)
      .map((id) => `<option value="${id}"${id === state.program ? " selected" : ""}>${esc(PROGRAMS[id].name)}</option>`).join("");
    return opts ? `<optgroup label="${esc(f)}">${opts}</optgroup>` : "";
  }).join("");
  return `<label class="plabel" for="progSel">Program for the week</label><select id="progSel">${groups}</select>` +
    (user && state.profile ? `<button type="button" class="link" data-profile="recs">Recommended for you</button>` : "");
}

function render() {
  syncGoal();
  if (pview === "profile") { $app.innerHTML = topbar() + profileView(); return; }
  if (pview === "recs") { $app.innerHTML = topbar() + recsView(); return; }
  const prog = PROGRAMS[state.program];
  const today = todayKey();
  const sid = getSid(selected);
  const s = SESSIONS[sid];
  const items = getItems(sid);
  const c = counts(sid);

  const seg = programMenu();

  const week = ORDER.map((d) => {
    const dsid = getSid(d);
    const k = SESSIONS[dsid].kind;
    return `<button type="button" class="day k-${k}" data-day="${d}" aria-pressed="${d === selected}"` +
      `${d === today ? ' aria-current="date"' : ""} aria-label="${FULL[d]}, ${esc(SESSIONS[dsid].title)}">` +
      `${SHORT[d]}<span class="bar"></span></button>`;
  }).join("");

  const rows = items.map((it) => {
    const slg = slug(it.n);
    const dk = doneKey(sid, it);
    const isDone = !!state.done[dk];
    const w = state.weights[slg] || "";
    const tag = it.chest ? '<span class="tag">Upper chest</span>' : it.opt ? '<span class="tag">Optional</span>' : "";
    const alt = it.alt ? `<span class="alt">Can be replaced with ${esc(it.alt)}</span>` : "";
    return `<li class="row${it.chest ? " chest" : ""}${it.opt ? " opt" : ""}${isDone ? " done" : ""}">` +
      `<input type="checkbox" data-done="${esc(dk)}" aria-label="Mark ${esc(it.n)} done"${isDone ? " checked" : ""}>` +
      `<div class="name">${esc(it.n)}${tag}${alt}</div>` +
      `<div class="sets">${esc(it.s)}</div>` +
      (it.opt ? "" :
        `<div class="wt"><input type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" ` +
        `data-weight="${esc(slg)}" data-wname="${esc(it.n)}" value="${esc(w)}" placeholder="kg" aria-label="Last weight for ${esc(it.n)} in kg"><span>kg, last used</span></div>`) +
      `</li>`;
  }).join("");

  const body = editing ? editBody(sid, items) : (rows ? `<ul class="list">${rows}</ul>` : "") + (s.tip ? `<p class="tip">${esc(s.tip)}</p>` : "") + (s.kind === "run" ? runLog("") : (prog.runWith && prog.runWith[selected] ? runLog(prog.runWith[selected]) : ""));

  const tabs = tabBar();
  if (tab === "history") { $app.innerHTML = topbar() + tabs + historyView(); return; }
  if (tab === "body") { $app.innerHTML = topbar() + tabs + bodyView(); return; }
  $app.innerHTML =
    topbar() + tabs +
    `<p class="blurb">${esc(prog.blurb)}</p>` +
    `<div class="pmenu">${seg}</div>` +
    `<div class="week" role="group" aria-label="Week">${week}</div>` +
    weighPrompt() +
    `<section class="panel k-${s.kind}">` +
      `<div class="phead"><div class="top"><span class="dayname">${FULL[selected]}${selected === today ? ", today" : ""}</span>` +
      `<span class="right">${c.total && !editing ? `<span class="count" id="count">${c.done} of ${c.total}</span>` : ""}<button type="button" class="edit" data-edit="toggle">${editing ? "Done" : "Edit"}</button></span></div>` +
      `<h2>${esc(s.title)}</h2><p class="note">${esc(s.cn && !(PROGRAM_META[state.program] || {}).combat ? "" : s.note)}</p></div>` +
      body +
    `</section>` +
    insightCard() +
    `<p class="foot">Checkmarks reset each Monday. Weights and edits are saved to your account when you are signed in, or on this device if not.</p>`;
}

$app.addEventListener("click", (e) => {
  const pf = e.target.closest("[data-profile]");
  if (pf) { pview = pf.dataset.profile === "recs" ? "recs" : "profile"; render(); window.scrollTo(0, 0); return; }
  if (e.target.closest("[data-psave]")) { saveProfile(); return; }
  if (e.target.closest("[data-pskip]")) { state.profileSkip = true; save(); pview = ""; render(); return; }
  if (e.target.closest("[data-pcancel]") || e.target.closest("[data-pback]")) { pview = ""; render(); window.scrollTo(0, 0); return; }
  const up = e.target.closest("[data-usep]");
  if (up && PROGRAMS[up.dataset.usep]) {
    state.program = up.dataset.usep; customIdx = -1; editing = false; pview = "";
    save(); render(); window.scrollTo(0, 0); return;
  }
  if (e.target.closest("[data-insight]")) { getInsight(); return; }
  const au = e.target.closest("[data-auth]");
  if (au) {
    const a = au.dataset.auth;
    if (a === "signin" || a === "signup") doAuth(a);
    else if (a === "guest") { try { localStorage.setItem(GUEST_KEY, "1"); } catch (err) {} render(); }
    else if (a === "google") doGoogle();
    else if (a === "forgot") doForgot();
    else if (a === "setpass") doSetPass();
    else if (a === "in") showAuth();
    else if (a === "out") doSignOut();
    return;
  }
  const tb = e.target.closest("[data-tab]");
  if (tb) { tab = tb.dataset.tab; editing = false; pendingDel = ""; render(); window.scrollTo(0, 0); return; }
  if (e.target.closest("[data-runsave]")) { saveRun(); return; }
  const dr = e.target.closest("[data-delrun]");
  if (dr) { pendingDel = "r|" + dr.dataset.delrun; render(); return; }
  if (e.target.closest("[data-delno]")) { pendingDel = ""; render(); return; }
  const okd = e.target.closest("[data-delok]");
  if (okd) { confirmDelete(okd.dataset.delok); return; }
  const bs = e.target.closest("[data-bodysave]");
  if (bs) {
    const inp = document.getElementById(bs.dataset.bodysave);
    if (inp && saveBody(inp.value)) render(); else if (inp) inp.focus();
    return;
  }
  const dl = e.target.closest("[data-del]");
  if (dl) { pendingDel = dl.dataset.del; render(); return; }
  if (e.target.closest("[data-edit]")) { customIdx = -1; editing = !editing; render(); return; }
  const mv = e.target.closest("[data-move]");
  if (mv) {
    const parts = mv.dataset.move.split("|");
    const i = Number(parts[0]);
    const j = i + Number(parts[1]);
    const sid = getSid(selected);
    const arr = getItems(sid).slice();
    if (j < 0 || j >= arr.length) return;
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    customIdx = -1;
    state.custom.sessions[sid] = arr; save(); render(); return;
  }
  const rm = e.target.closest("[data-remove]");
  if (rm) {
    const sid = getSid(selected);
    const arr = getItems(sid).slice();
    customIdx = -1;
    arr.splice(Number(rm.dataset.remove), 1);
    state.custom.sessions[sid] = arr; save(); render(); return;
  }
  if (e.target.closest("[data-add]")) {
    const n = document.getElementById("newName").value.trim() || document.getElementById("newSel").value;
    if (!n) return;
    const sets = document.getElementById("newSets").value.trim() || "3 x 10";
    const sid = getSid(selected);
    state.custom.sessions[sid] = getItems(sid).concat([{ n, s: sets, chest: CHEST.has(n) }]);
    save(); render(); return;
  }
  const rs = e.target.closest("[data-reset]");
  if (rs) {
    const sid = getSid(selected);
    if (rs.dataset.reset === "session") delete state.custom.sessions[sid];
    else if (state.custom.week[state.program]) delete state.custom.week[state.program][selected];
    save(); render(); return;
  }
  const p = e.target.closest("[data-program]");
  if (p) { state.program = p.dataset.program; save(); render(); return; }
  const d = e.target.closest("[data-day]");
  if (d) { selected = d.dataset.day; render(); }
});

$app.addEventListener("change", (e) => {
  if (e.target.closest("[data-rf]")) { recalcRun(); return; }
  const wi = e.target.closest("[data-weight]");
  if (wi) { recordWeight(wi.dataset.weight, wi.dataset.wname, wi.value); return; }
  if (e.target.id === "pUnit") {
    const cmEl = document.getElementById("pCm"), ftEl = document.getElementById("pFt"), inEl = document.getElementById("pIn");
    if (e.target.value === "ft") {
      const c = Number(String(cmEl.value).replace(",", ".")) || 0;
      if (c) { const t = Math.round(c / 2.54); ftEl.value = Math.floor(t / 12); inEl.value = t % 12; }
      document.getElementById("hCm").hidden = true;
      document.getElementById("hFt").hidden = false;
    } else {
      const t = (Number(ftEl.value) || 0) * 12 + (Number(inEl.value) || 0);
      if (t) cmEl.value = Math.round(t * 2.54);
      document.getElementById("hCm").hidden = false;
      document.getElementById("hFt").hidden = true;
    }
    return;
  }
  if (e.target.dataset && e.target.dataset.pgoal) {
    const hint = document.getElementById("pGoalHint");
    if (document.querySelectorAll("[data-pgoal]:checked").length > 2) { e.target.checked = false; if (hint) hint.textContent = "Pick up to 2 goals."; }
    else if (hint) hint.textContent = "";
    return;
  }
  if (e.target.id === "goalsIn") { state.goals = e.target.value.trim().slice(0, 200); save(); return; }
  if (e.target.id === "progSel") {
    if (PROGRAMS[e.target.value]) state.program = e.target.value;
    customIdx = -1; editing = false;
    save(); render(); return;
  }
  if (e.target.id === "varSel") {
    state.program = e.target.value;
    customIdx = -1; editing = false;
    save(); render(); return;
  }
  if (e.target.id === "bodyDay") { state.bodyDay = e.target.value; save(); render(); return; }
  if (e.target.id === "sessSel") {
    const wk = state.custom.week[state.program] = state.custom.week[state.program] || {};
    wk[selected] = e.target.value; save(); render(); return;
  }
  const sel = e.target.closest("[data-esel]");
  if (sel) {
    const i = Number(sel.dataset.esel);
    if (sel.value === "__custom__") {
      customIdx = i; render();
      const f = $app.querySelector("[data-ename]");
      if (f) f.focus();
      return;
    }
    const sid = getSid(selected);
    const arr = getItems(sid).slice();
    arr[i] = Object.assign({}, arr[i], { n: sel.value, chest: CHEST.has(sel.value), alt: arr[i].alt === sel.value ? arr[i].n : arr[i].alt });
    state.custom.sessions[sid] = arr; save(); return;
  }
  const en = e.target.closest("[data-ename]");
  const es = e.target.closest("[data-esets]");
  if (en || es) {
    const sid = getSid(selected);
    const arr = getItems(sid).slice();
    if (en) {
      const i = Number(en.dataset.ename);
      const n = en.value.trim();
      customIdx = -1;
      if (!n) { render(); return; }
      arr[i] = Object.assign({}, arr[i], { n, chest: CHEST.has(n) });
      state.custom.sessions[sid] = arr; save(); render(); return;
    } else {
      const i = Number(es.dataset.esets);
      const v = es.value.trim();
      if (!v) { render(); return; }
      arr[i] = Object.assign({}, arr[i], { s: v });
    }
    state.custom.sessions[sid] = arr; save(); return;
  }
  const cb = e.target.closest("[data-done]");
  if (!cb) return;
  const key = cb.dataset.done;
  if (cb.checked) state.done[key] = true; else delete state.done[key];
  save();
  const wrow = cb.closest(".row");
  const wbox = wrow ? wrow.querySelector("[data-weight]") : null;
  if (cb.checked && wbox && wbox.value) recordWeight(wbox.dataset.weight, wbox.dataset.wname, wbox.value);
  cb.closest(".row").classList.toggle("done", cb.checked);
  const sid = getSid(selected);
  const c = counts(sid);
  const el = document.getElementById("count");
  if (el) el.textContent = c.done + " of " + c.total;
});

$app.addEventListener("input", (e) => {
  const rf = e.target.closest("[data-rf]");
  if (rf) { if (rf.dataset.rf in runAuto) runAuto[rf.dataset.rf] = false; return; }
  const w = e.target.closest("[data-weight]");
  if (!w) return;
  const v = w.value.trim();
  if (v) state.weights[w.dataset.weight] = v; else delete state.weights[w.dataset.weight];
  save();
});

const SUPABASE_URL = "https://qxuhlfandcuhkohcmtnt.supabase.co";
const SUPABASE_KEY = "sb_publishable_JhY4iBI-PZGTvQNhTApaHQ_PCATDpjW";
const DIRTY_KEY = "training:dirty";
const GUEST_KEY = "training:guest";

let recoveryMode = /type=recovery/.test(window.location.hash);
let sb = null;
try {
  if (window.supabase && window.supabase.createClient) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
} catch (e) { sb = null; }

let user = null;
let syncMsg = "";
let lastAt = 0;
let pushTimer = null;
let pushing = false;

function isDirty() { try { return localStorage.getItem(DIRTY_KEY) === "1"; } catch (e) { return false; } }
function setDirty(v) {
  try { if (v) localStorage.setItem(DIRTY_KEY, "1"); else localStorage.removeItem(DIRTY_KEY); } catch (e) {}
}
function setSync(m) {
  syncMsg = m;
  const el = document.getElementById("sync");
  if (el) el.textContent = m;
}

function topbar() {
  let right = "";
  if (sb && user) {
    right = `<div class="acct"><span class="who">${esc((state.profile && state.profile.name) || user.email || "")}</span><span id="sync" class="sync">${esc(syncMsg)}</span>` +
      `<span class="lnks"><button type="button" class="link" data-profile="edit">Profile</button><button type="button" class="link" data-auth="out">Sign out</button></span></div>`;
  } else if (sb) {
    right = `<div class="acct"><button type="button" class="link" data-auth="in">Sign in to sync</button></div>`;
  }
  return `<div class="topbar"><h1>Training</h1>${right}</div>`;
}

function normalizeState(b) {
  if (!b || typeof b !== "object") b = {};
  if (!PROGRAMS[b.program]) b.program = "fb3";
  if (!b.weights || typeof b.weights !== "object") b.weights = {};
  if (!b.done || typeof b.done !== "object") b.done = {};
  if (!b.history || typeof b.history !== "object") b.history = {};
  if (!Array.isArray(b.body)) b.body = [];
  if (!Array.isArray(b.runs)) b.runs = [];
  if (!JS_DAYS.includes(b.bodyDay)) b.bodyDay = "sun";
  if (!b.custom || typeof b.custom !== "object") b.custom = {};
  if (!b.custom.sessions || typeof b.custom.sessions !== "object") b.custom.sessions = {};
  if (!b.custom.week || typeof b.custom.week !== "object") b.custom.week = {};
  const wk = weekKey() + "|";
  Object.keys(b.done).forEach((k) => { if (!k.startsWith(wk)) delete b.done[k]; });
  return b;
}

function replaceState(obj) {
  Object.keys(state).forEach((k) => { delete state[k]; });
  Object.assign(state, obj);
}

function mergeState(loc, remote) {
  const out = normalizeState(JSON.parse(JSON.stringify(remote || {})));
  out.weights = Object.assign({}, loc.weights, out.weights);
  out.done = Object.assign({}, loc.done, out.done);
  if (!out.goals && loc.goals) out.goals = loc.goals;
  if (!out.lastInsight && loc.lastInsight) out.lastInsight = loc.lastInsight;
  if (!out.profile && loc.profile) out.profile = loc.profile;
  Object.keys(loc.history).forEach((k) => {
    const lh = loc.history[k];
    const rh = out.history[k];
    if (!rh) { out.history[k] = lh; return; }
    lh.e.forEach((x) => { if (!rh.e.some((y) => y.d === x.d)) rh.e.push(x); });
    rh.e.sort((p, q) => (p.d < q.d ? -1 : 1));
  });
  loc.body.forEach((x) => { if (!out.body.some((y) => y.w === x.w)) out.body.push(x); });
  out.body.sort((p, q) => (p.d < q.d ? -1 : 1));
  loc.runs.forEach((x) => { if (!out.runs.some((y) => y.id === x.id)) out.runs.push(x); });
  out.runs.sort((p, q) => p.id - q.id);
  out.custom.sessions = Object.assign({}, loc.custom.sessions, out.custom.sessions);
  Object.keys(loc.custom.week).forEach((p) => {
    out.custom.week[p] = Object.assign({}, loc.custom.week[p], out.custom.week[p]);
  });
  return out;
}

function schedulePush() {
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushNow, 1200);
  setSync("Saving...");
}

async function pushNow() {
  if (!sb || !user) return;
  clearTimeout(pushTimer);
  if (pushing) { pushTimer = setTimeout(pushNow, 800); return; }
  pushing = true;
  try {
    const snapshot = JSON.parse(JSON.stringify(state));
    const sentAt = new Date().toISOString();
    const res = await sb.from("user_data").upsert({ user_id: user.id, data: snapshot, updated_at: sentAt });
    if (res.error) throw res.error;
    lastAt = Date.parse(sentAt);
    if (JSON.stringify(state) === JSON.stringify(snapshot)) setDirty(false);
    setSync("Saved");
  } catch (e) {
    const m = e && e.message ? e.message : "";
    setSync(/JWT|401/i.test(m) ? "Session expired. Sign out and back in." : "Offline, will retry");
  }
  pushing = false;
}

async function onSignedIn(session, mode) {
  user = session.user;
  try { localStorage.removeItem(GUEST_KEY); } catch (e) {}
  $app.innerHTML = topbar() + `<p class="blurb">Loading your data...</p>`;
  try {
    const r = await sb.from("user_data").select("data, updated_at").eq("user_id", user.id).maybeSingle();
    if (r.error) throw r.error;
    const has = r.data && r.data.data && typeof r.data.data === "object" && Object.keys(r.data.data).length > 0;
    let needPush = !has;
    if (has) {
      lastAt = Date.parse(r.data.updated_at) || 0;
      if (mode === "merge" || isDirty()) { replaceState(mergeState(state, r.data.data)); needPush = true; }
      else replaceState(normalizeState(JSON.parse(JSON.stringify(r.data.data))));
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    }
    if (needPush) { setDirty(true); await pushNow(); }
    setSync("Synced");
  } catch (e) {
    setSync("Offline. Using the data on this device.");
  }
  if (!state.profile && !state.profileSkip) pview = "profile";
  render();
}

function showAuth(msg) {
  $app.innerHTML = `<div class="topbar"><h1>Training</h1></div>` +
    `<p class="blurb">Sign in to save your progress and use it on any device.</p>` +
    `<section class="hcard">` +
    `<button type="button" class="btn gbtn" data-auth="google">Continue with Google</button>` +
    `<p class="hd or">or use your email</p>` +
    `<div class="ctl2"><label for="aEmail">Email</label><input id="aEmail" type="email" inputmode="email" autocomplete="email" autocapitalize="none"></div>` +
    `<div class="ctl2"><label for="aPass">Password (6 or more characters)</label><input id="aPass" type="password" autocomplete="current-password"></div>` +
    `<div class="inl2"><button type="button" class="btn" data-auth="signin">Sign in</button>` +
    `<button type="button" class="btn2" data-auth="signup">Create account</button></div>` +
    `<button type="button" class="link" data-auth="forgot">Forgot password?</button>` +
    `<p class="hd" id="aMsg">${esc(msg || "")}</p></section>` +
    `<button type="button" class="reset" data-auth="guest">Continue without an account (this device only)</button>`;
}

async function doAuth(kind) {
  const email = document.getElementById("aEmail").value.trim();
  const pass = document.getElementById("aPass").value;
  const msg = document.getElementById("aMsg");
  if (!email || !pass) { msg.textContent = "Enter your email and a password."; return; }
  if (kind === "signup" && pass.length < 6) { msg.textContent = "Use a password with at least 6 characters."; return; }
  msg.textContent = kind === "signup" ? "Creating your account..." : "Signing in...";
  try {
    const res = kind === "signup"
      ? await sb.auth.signUp({ email, password: pass })
      : await sb.auth.signInWithPassword({ email, password: pass });
    if (res.error) { msg.textContent = res.error.message; return; }
    if (res.data && res.data.session) { await onSignedIn(res.data.session, "merge"); return; }
    msg.textContent = "Account created. Check your email to confirm it, then sign in.";
  } catch (e) {
    msg.textContent = "Could not reach the server. Check your connection and try again.";
  }
}

const MERGE_KEY = "training:merge";

async function doForgot() {
  const email = document.getElementById("aEmail").value.trim();
  const msg = document.getElementById("aMsg");
  if (!email) { msg.textContent = "Type your email above, then tap Forgot password."; return; }
  msg.textContent = "Sending...";
  try {
    const res = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
    msg.textContent = res.error
      ? res.error.message
      : "If that email has an account, a reset link is on its way. Check your inbox and spam folder.";
  } catch (e) {
    msg.textContent = "Could not reach the server. Check your connection and try again.";
  }
}

function showReset(msg) {
  $app.innerHTML = `<div class="topbar"><h1>Training</h1></div>` +
    `<p class="blurb">Choose a new password.</p>` +
    `<section class="hcard">` +
    `<div class="ctl2"><label for="nPass">New password (6 or more characters)</label><input id="nPass" type="password" autocomplete="new-password"></div>` +
    `<button type="button" class="btn gbtn" data-auth="setpass">Save new password</button>` +
    `<p class="hd" id="aMsg">${esc(msg || "")}</p></section>`;
}

async function doSetPass() {
  const p = document.getElementById("nPass").value;
  const msg = document.getElementById("aMsg");
  if (p.length < 6) { msg.textContent = "Use at least 6 characters."; return; }
  msg.textContent = "Saving...";
  try {
    const res = await sb.auth.updateUser({ password: p });
    if (res.error) { msg.textContent = res.error.message; return; }
    recoveryMode = false;
    const s = await sb.auth.getSession();
    if (s.data && s.data.session) { await onSignedIn(s.data.session, "auto"); return; }
    showAuth("Password updated. Sign in with your new password.");
  } catch (e) {
    msg.textContent = "Could not reach the server. Try again.";
  }
}

async function doGoogle() {
  const msg = document.getElementById("aMsg");
  try {
    try { localStorage.setItem(MERGE_KEY, "1"); } catch (e) {}
    const res = await sb.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: window.location.origin + window.location.pathname }
    });
    if (res.error && msg) msg.textContent = res.error.message;
  } catch (e) {
    if (msg) msg.textContent = "Could not reach the server. Check your connection and try again.";
  }
}

async function doSignOut() {
  await pushNow();
  if (isDirty()) { setSync("Could not save yet. Connect and try again."); return; }
  try { await sb.auth.signOut(); } catch (e) {}
  user = null;
  try {
    localStorage.removeItem(KEY);
    localStorage.removeItem(DIRTY_KEY);
    localStorage.removeItem(GUEST_KEY);
  } catch (e) {}
  location.reload();
}

$app.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.id === "aPass") doAuth("signin");
  if (e.key === "Enter" && e.target.id === "nPass") doSetPass();
});

window.addEventListener("online", () => { if (user && isDirty()) pushNow(); });

document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible" || !sb || !user) return;
  if (isDirty()) { pushNow(); return; }
  try {
    const r = await sb.from("user_data").select("data, updated_at").eq("user_id", user.id).maybeSingle();
    if (r.error || !r.data || !r.data.data) return;
    if (!(Date.parse(r.data.updated_at) > lastAt) || isDirty()) return;
    lastAt = Date.parse(r.data.updated_at);
    replaceState(normalizeState(JSON.parse(JSON.stringify(r.data.data))));
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    const a = document.activeElement;
    if (!editing && !(a && a.tagName === "INPUT")) render();
  } catch (e) {}
});

async function boot() {
  if (!sb) { render(); return; }
  try {
    const r = await sb.auth.getSession();
    if (r.data && r.data.session && recoveryMode) { showReset(); return; }
    if (r.data && r.data.session) {
      let mode = "auto";
      try { if (localStorage.getItem(MERGE_KEY) === "1") { mode = "merge"; localStorage.removeItem(MERGE_KEY); } } catch (e) {}
      await onSignedIn(r.data.session, mode);
      return;
    }
  } catch (e) {}
  try { localStorage.removeItem(MERGE_KEY); } catch (e) {}
  let guest = false;
  try { guest = localStorage.getItem(GUEST_KEY) === "1"; } catch (e) {}
  if (guest) render(); else showAuth();
}

boot();
